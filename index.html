<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <h1>Calculator</h1>
        </div>
    </header>
    <main>
        <section class="calculator-container">
            <div id="display">0</div>
            <article class="calculator-keyboard">
                <button class="btn" data-key="+">+</button>
                <button class="btn" data-key="-">-</button>
                <button class="btn" data-key="*">*</button>
                <button class="btn" data-key="/">/</button>
                <button class="btn" data-key="7" data-type="number">7</button>
                <button class="btn" data-key="8" data-type="number">8</button>
                <button class="btn" data-key="9" data-type="number">9</button>
                <button class="btn" data-key="ac">AC</button>
                <button class="btn" data-key="4" data-type="number">4</button>
                <button class="btn" data-key="5" data-type="number">5</button>
                <button class="btn" data-key="6" data-type="number">6</button>
                <button class="btn" data-key="c">C</button>
                <button class="btn" data-key="1" data-type="number">1</button>
                <button class="btn" data-key="2" data-type="number">2</button>
                <button class="btn" data-key="3" data-type="number">3</button>
                <button class="btn" data-key="=">=</button>
                <button class="btn" data-key="0" data-type="number">0</button>
                <button class="btn" data-key="." data-type="decimal">.</button>
            </article>
        </section>
    </main>
    <footer class="footer">
        <div class="container">
            <p>Created by <span><a href="#">Gustavo Miño</a></span></p>
        </div>
    </footer>
    <script src="script.js" defer></script>
</body>

</html>
